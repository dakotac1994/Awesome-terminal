# lychee configuration for awesome-terminal
# Excludes are regexes — domain-bare patterns cover www/subdomains.

exclude = [
  # Bot-blocking / aggressive anti-automation
  "warp\\.dev",
  "mobaxterm\\.mobatek\\.net",
  "vandyke\\.com",
  "royalapps\\.com",
  "microsoft\\.com",
  "jetbrains\\.com",
  "ibm\\.com",
  # Anti-scraper responses observed during research
  "codeberg\\.org",
  # Connection-reset / empty-reply to automated checks (verified live 2026-09-30)
  "tmate\\.io",
  "zutty\\.org",
  # HTTP/2 protocol errors on legacy servers (verified live 2026-09-30)
  "putty\\.org",
  # Transient 429s from shared runner IPs (passed 2/3 runs; link verified live 2026-09-30)
  "gnu\\.org",
]

# Be lenient with transient failures but strict about real breakage
max_retries = 2
timeout = 20
accept = [200, 201, 202, 203, 204, 206]
